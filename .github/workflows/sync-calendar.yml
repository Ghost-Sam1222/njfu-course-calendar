name: Sync Course Calendar

on:
  push:
    branches:
      - main
  schedule:
    # 06:23 Asia/Shanghai every day. GitHub cron uses UTC.
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_CLASH_CONFIG: ${{ secrets.CLASH_CONFIG_YAML != '' }}
      HAS_CLASH_SUBSCRIPTION: ${{ secrets.CLASH_SUBSCRIPTION_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight
        id: preflight
        env:
          SYNC_ENABLED: ${{ vars.SYNC_ENABLED || 'true' }}
          SYNC_UNTIL: ${{ vars.SYNC_UNTIL }}
        run: |
          if [ "$SYNC_ENABLED" != "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(TZ=Asia/Shanghai date +%F)"
          if [ -n "$SYNC_UNTIL" ] && [ "$today" \> "$SYNC_UNTIL" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Mihomo proxy
        id: mihomo
        if: steps.preflight.outputs.should_run == 'true' && (env.HAS_CLASH_CONFIG == 'true' || env.HAS_CLASH_SUBSCRIPTION == 'true')
        continue-on-error: true
        env:
          CLASH_CONFIG_YAML: ${{ secrets.CLASH_CONFIG_YAML }}
          CLASH_SUBSCRIPTION_URL: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
          NO_PROXY: ${{ vars.NO_PROXY }}
          PROXY_TARGET_URL: ${{ vars.JW_BASE_URL || 'https://jwxt.njfu.edu.cn' }}
          NODE_OPTIONS: --use-env-proxy
        run: bash scripts/setup-mihomo.sh

      - name: Keep published calendar when proxy is unavailable
        if: steps.preflight.outputs.should_run == 'true' && (env.HAS_CLASH_CONFIG == 'true' || env.HAS_CLASH_SUBSCRIPTION == 'true') && steps.mihomo.outcome == 'failure'
        run: echo "Mihomo proxy is unavailable; leaving the published calendar unchanged."

      - name: Install dependencies
        if: steps.preflight.outputs.should_run == 'true' && ((env.HAS_CLASH_CONFIG != 'true' && env.HAS_CLASH_SUBSCRIPTION != 'true') || steps.mihomo.outcome == 'success')
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Generate iCalendar
        if: steps.preflight.outputs.should_run == 'true' && ((env.HAS_CLASH_CONFIG != 'true' && env.HAS_CLASH_SUBSCRIPTION != 'true') || steps.mihomo.outcome == 'success')
        env:
          JW_BASE_URL: ${{ vars.JW_BASE_URL || 'https://jwxt.njfu.edu.cn' }}
          JW_USERNAME: ${{ secrets.JW_USERNAME }}
          JW_PASSWORD: ${{ secrets.JW_PASSWORD }}
          JW_SEMESTER: ${{ vars.JW_SEMESTER }}
          TERM_FIRST_MONDAY: ${{ vars.TERM_FIRST_MONDAY }}
          TERM_WEEKS: ${{ vars.TERM_WEEKS || '20' }}
          CALENDAR_NAME: ${{ vars.CALENDAR_NAME || '南林课表' }}
          CALENDAR_TIMEZONE: Asia/Shanghai
          CALENDAR_REFRESH_INTERVAL: ${{ vars.CALENDAR_REFRESH_INTERVAL || 'PT6H' }}
          JW_PROVIDER: qz_browser
          EXCLUDE_DATES: ${{ vars.EXCLUDE_DATES }}
          MAKEUP_DATES: ${{ vars.MAKEUP_DATES }}
          MAKEUP_DAY_MAP: ${{ vars.MAKEUP_DAY_MAP }}
          AUTO_EXCLUDE_HOLIDAYS: ${{ vars.AUTO_EXCLUDE_HOLIDAYS || 'true' }}
          HOLIDAY_ICS_URLS: ${{ vars.HOLIDAY_ICS_URLS }}
          INCLUDE_EXAMS: ${{ vars.INCLUDE_EXAMS || 'false' }}
          EXAM_URLS: ${{ vars.EXAM_URLS }}
          SOFT_FAIL_ON_SOURCE_UNAVAILABLE: ${{ vars.SOFT_FAIL_ON_SOURCE_UNAVAILABLE || 'true' }}
          HTTPS_PROXY: ${{ steps.mihomo.outputs.proxy }}
          HTTP_PROXY: ${{ steps.mihomo.outputs.proxy }}
          NO_PROXY: ${{ vars.NO_PROXY }}
          NODE_OPTIONS: --use-env-proxy
        run: python scripts/sync_calendar.py

      - name: Commit changes
        if: steps.preflight.outputs.should_run == 'true' && ((env.HAS_CLASH_CONFIG != 'true' && env.HAS_CLASH_SUBSCRIPTION != 'true') || steps.mihomo.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/calendar.ics data/timetable.json
          git diff --cached --quiet || git commit -m "sync course calendar"
          git push
